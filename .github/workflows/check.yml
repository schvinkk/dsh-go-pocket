name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: |
          for f in lib/*.js bin/*.mjs test/*.mjs; do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test

      - name: Manifest sanity
        run: |
          node -e '
            const p = require("./package.json");
            const need = ["name","version","license","main","files","dshGo","author"];
            const miss = need.filter(k => !p[k]);
            if (miss.length) { console.error("missing:", miss.join(", ")); process.exit(1); }
            if (/YOUR_NAME/.test(JSON.stringify(p))) { console.error("placeholder YOUR_NAME still present"); process.exit(1); }
            if (p.dshGo.v !== 1) { console.error("dshGo.v must be 1"); process.exit(1); }
            const ids = new Set(p.dshGo.contributes.panels.map(x => x.id));
            for (const pnl of p.dshGo.contributes["composer.strip"]) {
              if (!ids.has(pnl.panel)) { console.error("strip references unknown panel:", pnl.panel); process.exit(1); }
            }
            console.log("manifest ok");
          '
